name: Desktop and firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python package_app.py
      - run: python tests/smoke_binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: BoardBench-${{ runner.os }}-${{ runner.arch }}
          path: dist/BoardBench*
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=opi firmware/BoardBenchProbe
